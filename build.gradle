plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    // The main source set compiles against the JDK alone for the SQL path -
    // the H2 driver is loaded reflectively by java.sql.DriverManager at run
    // time, so it is a runtime dependency only.
    runtimeOnly 'com.h2database:h2:2.2.224'

    // MongoDocumentStore, unlike SqlLedgerStore, imports the driver's classes
    // directly (com.mongodb.client...) - there is no JDK-native document
    // store API to load it reflectively through, so this has to be a real
    // compile-time dependency.
    implementation 'org.mongodb:mongodb-driver-sync:5.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test { useJUnitPlatform() }

// Dependency-free smoke run. Works with no network and no database.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}
